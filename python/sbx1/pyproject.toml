[project]
name = "sbx1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "open3d",
    "plotly>=6.8.0",
    "pyvista>=0.48.4",
]

[tool.uv.sources]
open3d = [
    { url = "https://github.com/isl-org/Open3D/releases/download/main-devel/open3d-0.19.0-cp314-cp314-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/isl-org/Open3D/releases/download/main-devel/open3d-0.19.0+63e30be-cp314-cp314-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
