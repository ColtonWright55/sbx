[project]
name = "myoptim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "benchmark-functions",
    "botorch",
    "cma",
    "numpy",
    "plotly",
    "pyvista",
    "scipy",
    "torch",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "myo"

[tool.ruff]
line-length = 120
